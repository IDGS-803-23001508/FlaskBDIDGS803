{% extends "layout.html" %}
{% block container %}

<div class="min-h-screen flex items-center justify-center bg-gray-50 w-full">
    <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8 text-center">

        <img src="{{ url_for('static', filename='img/usuario.jpg') }}"
            class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-blue-500 shadow-md">

        <h5 class="mb-2 text-2xl font-bold tracking-tight text-heading">
            ID: {{ alumno.id }}
        </h5>

        <h3 class="mb-2 text-xl font-semibold text-heading">
            Nombre: {{ alumno.nombre }}
        </h3>

        <h3 class="mb-2 text-xl font-semibold text-heading">
            Apellidos: {{ alumno.apellidos }}
        </h3>

        <h3 class="mb-2 text-xl font-semibold text-heading">
            Correo: {{ alumno.email }}
        </h3>

        <h3 class="mb-4 text-xl font-semibold text-heading">
            Teléfono: {{ alumno.telefono }}
        </h3>

        <div class="grid md:grid-cols-1 md:gap-6">
            <a href="{{ url_for('alumnos.listado') }}"
                class="text-center text-white bg-brand hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium rounded-base text-sm px-4 py-2.5">
                Regresar
            </a>
        </div>

    </div>
</div>

{% endblock %}
